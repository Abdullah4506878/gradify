version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: gradify_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gradify123
      POSTGRES_DB: gradify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\gradify\database